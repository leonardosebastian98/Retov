    function updateEquipmentChart(eq) {
      const settings = equipmentSettings[eq];
      let data = equipmentData[eq] || [];
      
      // Filtrar por tiempo o fechas
      if (settings.dateFrom || settings.dateTo) {
        data = data.filter(d => {
          if (settings.dateFrom && settings.dateTo) {
            return d.datetime >= settings.dateFrom && d.datetime <= settings.dateTo;
          } else if (settings.dateFrom) {
            return d.datetime >= settings.dateFrom;
          } else if (settings.dateTo) {
            return d.datetime <= settings.dateTo;
          }
          return true;
        });
      } else if (settings.filter && !settings.zoomStart) {
        // Filtro de hora: desde AHORA hacia atrás
        const now = new Date();
        const cutoff = new Date(now.getTime() - (settings.filter * 60 * 1000));
        data = data.filter(d => d.datetime >= cutoff && d.datetime <= now);
      }
      
      if (data.length === 0) return;
      
      const config = MACHINE_CONFIGS[currentMachineType];
      const isGolMode = config.isGolMode || false;
      const isSimpleMode = (config.ofMode === 0) && !isGolMode;
      const tco = config.tco;

      // En modo simple: calcular TCO óptimo del 10% más bajo de gaps
      // y usarlo como referencia fija en lugar de las órdenes de fabricación
      let simpleTCO = tco;
      if (isSimpleMode) {
        const prodData = data.filter(d => d.code !== 'P');
        const simpleGapMs = (config.simpleGapMin ?? 3) * tco * 1000;
        simpleTCO = calcOptimalTCO(prodData, tco, simpleGapMs);
        equipmentSettings[eq].simpleTCO = simpleTCO;
      }

      // Multiplicador de gap para decidir si generar amarillos
      // OF: usa gapTCO * 3 (hardcoded en el loop)
      // Simple: usa simpleGapMin del config (por defecto 3)
      const gapMinMult = isSimpleMode ? (config.simpleGapMin ?? 3) : 3;
      
      // MODO ESPECIAL: Balancines (GOL) - Solo mostrar valores reales sin procesamiento
      if (isGolMode) {
        const complete = data.map(d => ({
          x: d.datetime.getTime(),
          y: d.value,
          isProjected: false,
          isHollow: false
        }));
        
        // Calcular promedio
        const avgVal = data.length > 0 ? Math.round(data.reduce((s, d) => s + d.value, 0) / data.length) : 0;
        
        renderGolChart(eq, complete, avgVal, settings);
        return;
      }
      
      // MODO NORMAL: Con TCO
      // Usar TCO del config como fallback, pero será dinámico por orden
      const baseTCO = tco;
      const baseMaxAllowed = tco * 4;
      
      // Calcular avgInt inicial (se actualizará dinámicamente en el loop)
      const baseAvgInt = tco * 1000;
      const validForAvg = data.filter(d => d.code !== 'P' && d.value <= baseMaxAllowed);
      const avgVal = validForAvg.length > 0 ? Math.round(validForAvg.reduce((s, d) => s + d.value, 0) / validForAvg.length) : tco;
      const complete = [];
      const verticalLines = [];
      let lastRealTime = null;
      // En modo simple: gapMaximo viene de simpleGapMin (horas × ms)
      // En modo normal: gapMaximo global (7.5h)
      const gapMaximo = isSimpleMode
        ? (config.simpleGapMin ?? 7.5) * 60 * 60 * 1000
        : CONFIG.gapMaximo;
      
      // PROCESAR PARADAS: Detectar rangos P0->P1/P2/P3
      const stopRanges = [];
      for (let i = 0; i < data.length; i++) {
        if (data[i].code === 'P' && data[i].value === 0) {
          // Inicio de parada (P 0)
          const startTime = data[i].datetime.getTime();
          
          // Buscar el siguiente código P
          let endTime = null;
          let stopType = 'yellow'; // Default: amarillo (sin clasificar)
          
          for (let j = i + 1; j < data.length; j++) {
            if (data[j].code === 'P') {
              endTime = data[j].datetime.getTime();
              // Clasificar tipo de parada según el valor
              if (data[j].value === 1) stopType = 'red'; // Falta de insumos
              else if (data[j].value === 2) stopType = 'green'; // Mantenimiento
              else if (data[j].value === 3) stopType = 'gray'; // Falta de personal
              else if (data[j].value === 4) stopType = 'blue'; // Setup
              break;
            }
          }
          
          // Si no se encontró cierre, la parada llega hasta ahora
          if (!endTime) {
            endTime = new Date().getTime();
          }
          
          stopRanges.push({ startTime, endTime, stopType });
        }
      }
      
      // Función helper para determinar si un timestamp está en una parada
      function getStopType(timestamp) {
        for (const range of stopRanges) {
          if (timestamp > range.startTime && timestamp < range.endTime) {
            return range.stopType;
          }
        }
        return null;
      }
      
      // Filtrar códigos P de los datos de producción
      data = data.filter(d => d.code !== 'P');
      
      // Filtro antirebote: ignorar pulsos menores a minPulse segundos
      if (config.minPulse > 0) {
        data = data.filter(d => d.value >= config.minPulse);
      }
      
      // ── PRE-CÁLCULO DE PERÍODOS (modo simple) ──────────────────────────
      // Identificar períodos de trabajo antes del loop para poder usar
      // el TCO óptimo por período durante la generación de amarillos
      let simplePeriods = []; // [{ start, end, optTCO }]
      
      if (isSimpleMode && data.length > 0) {
        // Encontrar cortes de período por gap > gapMaximo
        const cuts = []; // timestamps de inicio/fin de cada período
        let pStart = data[0].datetime.getTime();
        
        for (let i = 1; i < data.length; i++) {
          const gap = data[i].datetime - data[i-1].datetime;
          if (gap > gapMaximo) {
            cuts.push({ start: pStart, end: data[i-1].datetime.getTime() });
            pStart = data[i].datetime.getTime();
          }
        }
        cuts.push({ start: pStart, end: data[data.length-1].datetime.getTime() });
        
        // Calcular TCO óptimo (10% más bajo) para cada período
        // Excluir puntos cuyo valor supera 4× el TCO de referencia (lentos)
        // para que no contaminen el percentil
        simplePeriods = cuts.map(({ start, end }) => {
          const pts = data.filter(d => {
            const t = d.datetime.getTime();
            return t >= start && t <= end;
          });
          if (pts.length < 3) return { start, end, optTCO: simpleTCO };
          // Primer pasada: calcular mediana para saber qué es "lento"
          const allVals = pts.map(p => p.value).sort((a,b) => a-b);
          const median  = allVals[Math.floor(allVals.length / 2)];
          // Filtrar: solo valores menores a 4× la mediana (elimina outliers lentos)
          const cleanVals = allVals.filter(v => v <= median * 4);
          const vals = cleanVals.length >= 3 ? cleanVals : allVals;
          vals.sort((a,b) => a-b);
          const n10 = Math.max(1, Math.floor(vals.length * 0.10));
          const optTCO = Math.round(vals.slice(0, n10).reduce((s,v)=>s+v,0) / n10);
          return { start, end, optTCO: optTCO > 0 ? optTCO : simpleTCO };
        });
      }
      
      // Helper: TCO activo en un timestamp para modo simple (por período)
      function getSimpleTCOAt(ts) {
        for (const p of simplePeriods) {
          if (ts >= p.start && ts <= p.end) return p.optTCO;
        }
        return simpleTCO; // fallback
      }
      
      for (let i = 0; i < data.length; i++) {
        const cur = data[i];
        
        // TCO activo: modo simple usa TCO óptimo del período; OF usa orden activa
        const currentTCO = isSimpleMode
          ? getSimpleTCOAt(cur.datetime.getTime())
          : getTCOForTimestamp(cur.datetime.getTime(), eq);
        const maxAllowed = currentTCO * 4;
        const avgInt = currentTCO * 1000;
        
        // Comparar siempre contra cur.value (dato crudo), nunca contra p.y
        const isOverLimit = cur.value > maxAllowed;
        
        if (lastRealTime) {
          const gap = cur.datetime - lastRealTime;
          
          // TCO para el gap
          const gapTCO = isSimpleMode
            ? simpleTCO
            : getTCOForTimestamp(lastRealTime.getTime());
          const gapAvgInt = gapTCO * 1000;
          
          // Detectar período largo (>7.5 horas)
          if (gap > gapMaximo) {
            // Marcar el último punto antes del período largo
            verticalLines.push({
              x: lastRealTime.getTime(),
              label: 'Fin período'
            });
            
            // Marcar el primer punto después del período largo
            verticalLines.push({
              x: cur.datetime.getTime(),
              label: 'Inicio período'
            });
            
            // El primer punto después de gap largo debe estar en tiempo estándar
            if (isOverLimit) {
              // Remover amarillos anteriores coincidentes
              const tolerance = (currentTCO / 2) * 1000;
              const coincidentIndices = [];
              
              for (let idx = complete.length - 1; idx >= 0; idx--) {
                const p = complete[idx];
                if (p.isProjected && !p.isHollow && 
                    p.x < cur.datetime.getTime() && 
                    Math.abs(p.x - cur.datetime.getTime()) <= tolerance) {
                  coincidentIndices.push(idx);
                }
              }
              
              for (const idx of coincidentIndices) {
                complete.splice(idx, 1);
              }
              
              complete.push({ x: cur.datetime.getTime(), y: currentTCO, isProjected: false, isHollow: true, realValue: cur.value });
            } else {
              // Punto normal, ajustar a tiempo estándar (TCO antes del punto real)
              const adjustedTime = new Date(cur.datetime.getTime() - avgInt);
              complete.push({ x: adjustedTime.getTime(), y: cur.value, isProjected: false, isHollow: false });
            }
          } else if (gap > gapAvgInt * gapMinMult) {
            // Gap normal (>3×TCO pero <gapMaximo)
            let pt = new Date(lastRealTime.getTime() + gapAvgInt);
            const targetTime = cur.datetime;
            
            // SEGURIDAD: Limitar a máximo 10000 puntos amarillos por gap
            let safetyCounter = 0;
            const MAX_YELLOW_POINTS = 10000;
            
            while (pt < targetTime && safetyCounter < MAX_YELLOW_POINTS) {
              const yellowTCO = isSimpleMode
                ? getSimpleTCOAt(pt.getTime())
                : getTCOForTimestamp(pt.getTime(), eq);
              const stopType = getStopType(pt.getTime());
              complete.push({ 
                x: pt.getTime(), 
                y: yellowTCO, 
                isProjected: true, 
                isHollow: false,
                stopType: stopType
              });
              const nextYellowTCO = isSimpleMode
                ? getSimpleTCOAt(pt.getTime() + 1000)
                : getTCOForTimestamp(pt.getTime() + 1000, eq);
              pt = new Date(pt.getTime() + (nextYellowTCO * 1000));
              safetyCounter++;
            }
            
            if (safetyCounter >= MAX_YELLOW_POINTS) {
              console.warn(`⚠️ Límite de seguridad alcanzado: ${MAX_YELLOW_POINTS} puntos amarillos generados para gap de ${Math.round(gap / 1000 / 60)} minutos`);
            }
            
            if (isOverLimit) {
              const tolerance = (currentTCO / 2) * 1000;
              const coincidentIndices = [];
              
              for (let idx = complete.length - 1; idx >= 0; idx--) {
                const p = complete[idx];
                if (p.isProjected && !p.isHollow && 
                    p.x < cur.datetime.getTime() && 
                    Math.abs(p.x - cur.datetime.getTime()) <= tolerance) {
                  coincidentIndices.push(idx);
                }
              }
              
              for (const idx of coincidentIndices) {
                complete.splice(idx, 1);
              }
              
              complete.push({ x: cur.datetime.getTime(), y: currentTCO, isProjected: false, isHollow: true, realValue: cur.value });
            } else {
              const adjustedTime = new Date(pt.getTime() - gapAvgInt + gapAvgInt);
              complete.push({ x: adjustedTime.getTime(), y: cur.value, isProjected: false, isHollow: false });
            }
          } else if (isOverLimit) {
            // Punto sobre límite sin gap previo
            const tolerance = (currentTCO / 2) * 1000;
            const coincidentIndices = [];
            
            for (let idx = complete.length - 1; idx >= 0; idx--) {
              const p = complete[idx];
              if (p.isProjected && !p.isHollow && 
                  p.x < cur.datetime.getTime() && 
                  Math.abs(p.x - cur.datetime.getTime()) <= tolerance) {
                coincidentIndices.push(idx);
              }
            }
            
            for (const idx of coincidentIndices) {
              complete.splice(idx, 1);
            }
            
            complete.push({ x: cur.datetime.getTime(), y: currentTCO, isProjected: false, isHollow: true, realValue: cur.value });
          } else {
            // Sin gap ni sobre límite
            complete.push({ x: cur.datetime.getTime(), y: cur.value, isProjected: false, isHollow: false });
          }
        } else {
          // Primer punto
          if (isOverLimit) {
            complete.push({ x: cur.datetime.getTime(), y: currentTCO, isProjected: false, isHollow: true, realValue: cur.value });
          } else {
            complete.push({ x: cur.datetime.getTime(), y: cur.value, isProjected: false, isHollow: false });
          }
        }
        
        // Actualizar lastRealTime - SIEMPRE, incluyendo puntos lentos
        lastRealTime = cur.datetime;
      }
      
      // Propagar códigos (TOK/TNG) desde data a complete
      // Crear un map de timestamps a códigos
      const codeMap = new Map();
      data.forEach(d => {
        if (d.code) {
          codeMap.set(d.datetime.getTime(), d.code);
        }
      });
      
      // Asignar códigos a puntos en complete
      complete.forEach(point => {
        if (!point.isProjected && codeMap.has(point.x)) {
          point.code = codeMap.get(point.x);
        }
      });
      
      // Proyecciones hasta ahora
      const now = new Date(), since = now - lastRealTime;
      const lastTCO = isSimpleMode
        ? getSimpleTCOAt(lastRealTime ? lastRealTime.getTime() : now.getTime())
        : getTCOForTimestamp(lastRealTime ? lastRealTime.getTime() : now.getTime(), eq);
      const lastAvgInt = lastTCO * 1000;
      
      if (since > lastAvgInt * gapMinMult) {
        let pt = new Date(lastRealTime.getTime() + lastAvgInt);
        
        let safetyCounter = 0;
        const MAX_PROJECTIONS = 5000;
        
        while (pt <= now && safetyCounter < MAX_PROJECTIONS) {
          const projTCO = isSimpleMode
            ? simpleTCO
            : getTCOForTimestamp(pt.getTime(), eq);
          const stopType = getStopType(pt.getTime());
          complete.push({ 
            x: pt.getTime(), 
            y: projTCO, 
            isProjected: true, 
            isHollow: false,
            stopType: stopType
          });
          
          // Incrementar usando el TCO de la siguiente proyección
          const nextProjTCO = getTCOForTimestamp(pt.getTime() + 1000, eq); // +1 segundo para ver siguiente orden
          pt = new Date(pt.getTime() + (nextProjTCO * 1000));
          safetyCounter++;
        }
        
        if (safetyCounter >= MAX_PROJECTIONS) {
          console.warn(`⚠️ Límite de proyecciones alcanzado: ${MAX_PROJECTIONS} puntos`);
        }
      }
      
      // Si hay gap entre último proceso y ahora, agregar línea vertical
      if (lastRealTime && (now - lastRealTime) > gapMaximo) {
        // Encontrar el último punto azul
        for (let i = complete.length - 1; i >= 0; i--) {
          if (!complete[i].isProjected) {
            verticalLines.push({ x: complete[i].x, isStart: false });
            break;
          }
        }
      }
      
      // Contar puntos válidos (azules sólidos) Y puntos lentos (círculos huecos) para estadísticas
      const producedPieces = complete.filter(d => !d.isProjected); // Sólidos y huecos
      
      // Las estadísticas se actualizarán después de crear/actualizar el chart
      
      const colors = complete.map(d => {
        // TNG (falla) = rojo
        if (d.code === 'TNG') return '#ef4444';
        // Círculos huecos = transparente
        if (d.isHollow) return 'rgba(0, 102, 255, 0)';
        // Paradas con tipo específico
        if (d.isProjected && d.stopType) {
          if (d.stopType === 'red') return '#dc2626'; // Rojo (falta insumos)
          if (d.stopType === 'green') return '#16a34a'; // Verde (mantenimiento)
          if (d.stopType === 'gray') return '#6b7280'; // Gris (falta personal)
          if (d.stopType === 'blue') return '#3b82f6'; // Azul claro (setup)
        }
        // Amarillos = proyectados sin clasificar
        if (d.isProjected) return '#fbbf24';
        // TOK o normal = azul
        return '#0066ff';
      });
      
      const borderColors = complete.map(d => {
        // TNG (falla) = rojo
        if (d.code === 'TNG') return '#ef4444';
        // Círculos huecos = borde azul
        if (d.isHollow) return '#0066ff';
        // Paradas con tipo específico
        if (d.isProjected && d.stopType) {
          if (d.stopType === 'red') return '#dc2626';
          if (d.stopType === 'green') return '#16a34a';
          if (d.stopType === 'gray') return '#6b7280';
          if (d.stopType === 'blue') return '#3b82f6';
        }
        // Amarillos = amarillo
        if (d.isProjected) return '#fbbf24';
        // TOK o normal = azul
        return '#0066ff';
      });
      
      const borderWidths = complete.map(d => d.isHollow ? 2 : 0);
      
      // Divisiones de tiempo
      let timeUnit = 'hour', timeStep = 1;
      if (settings.filter === 60) { timeUnit = 'minute'; timeStep = 5; }
      else if (settings.filter === 360) { timeUnit = 'minute'; timeStep = 15; }
      else if (settings.filter === 720) { timeUnit = 'minute'; timeStep = 30; }
      else if (settings.filter === 1440) { timeUnit = 'hour'; timeStep = 1; }
      else if (settings.filter === 10080) { timeUnit = 'day'; timeStep = 1; }
      
      // Límites
      let minTime, maxTime;
      if (settings.zoomStart && settings.zoomEnd) {
        // Si hay zoom activo, usar esos límites
        minTime = new Date(settings.zoomStart);
        maxTime = new Date(settings.zoomEnd);
      } else if (settings.dateFrom || settings.dateTo) {
        minTime = settings.dateFrom || new Date(settings.dateTo.getTime() - (30 * 24 * 60 * 60 * 1000));
        maxTime = settings.dateTo || new Date(settings.dateFrom.getTime() + (30 * 24 * 60 * 60 * 1000));
      } else {
        minTime = new Date(now.getTime() - (settings.filter * 60 * 1000));
        maxTime = now;
      }
      
      const ctx = document.getElementById(`chart-${eq}`).getContext('2d');
      
      // Configurar anotaciones para líneas verticales y línea TCO
      const annotations = {};
      
      // Filtrar órdenes de fabricación para este equipo específico
      // Combinar órdenes del equipo + órdenes 'ALL' (que aplican a todos)
      const specificOrders = fabricationOrders[eq] || [];
      const allOrders = fabricationOrders['ALL'] || [];
      const equipmentOrders = [...specificOrders, ...allOrders];
      
      // Agregar líneas TCO dinámicas y marcadores de órdenes de fabricación
      if (equipmentOrders.length > 0) {
        equipmentOrders.forEach((order, idx) => {
          // Línea vertical roja al inicio de la orden
          annotations[`orderStart${idx}`] = {
            type: 'line',
            xMin: order.startTime,
            xMax: order.startTime,
            borderColor: '#ef4444',
            borderWidth: 3,
            label: {
              content: `Orden ${order.orderNum}`,
              enabled: true,
              position: 'start',
              yAdjust: -10,
              backgroundColor: 'rgba(239, 68, 68, 0.9)',
              color: '#fff',
              font: { size: 11, weight: 'bold' }
            }
          };
          
          // Línea TCO horizontal de la orden (desde inicio hasta fin de orden)
          annotations[`orderTCO${idx}`] = {
            type: 'line',
            xMin: order.startTime,
            xMax: order.endTime,
            yMin: order.tco,
            yMax: order.tco,
            borderColor: '#3b82f6',
            borderWidth: 2,
            borderDash: [10, 5],
            label: {
              content: `TCO: ${order.tco}s`,
              enabled: true,
              position: 'center',
              backgroundColor: 'rgba(59, 130, 246, 0.8)',
              color: '#fff',
              font: { size: 10 }
            }
          };
          
          // Tooltip con información de la orden — borde izquierdo alineado con la línea de inicio
          annotations[`orderInfo${idx}`] = {
            type: 'label',
            xValue: order.startTime,
            yValue: (ctx) => {
              const yScale = ctx.chart.scales.y;
              return yScale.max * 0.85;
            },
            // xAdjust desplaza el CENTRO del label.
            // position 'start' en xAdjust no existe en este plugin,
            // así que lo calculamos dinámicamente:
            // borde izquierdo = línea → centro = línea + mitad del ancho del label
            // El ancho del label depende del contenido; usamos afterDraw para leerlo.
            // Mientras tanto ponemos xAdjust: 0 y lo corregimos en afterDraw.
            xAdjust: 0,
            display: (ctx) => showOrderTooltips,
            content: (ctx) => {
              // Calcular producción real para esta orden EN ESTA MÁQUINA
              const allData = ctx.chart.data.datasets[0].data || [];
              const orderPointsThisMachine = allData.filter(d => 
                !d.isProjected && d.x >= order.startTime && d.x < order.endTime
              );
              const unitsThisMachine = orderPointsThisMachine.length;
              
              // Calcular producción TOTAL entre TODAS las máquinas con esta orden
              let totalUnitsAllMachines = 0;
              const allMachinesForOrder = order.machines || [];
              
              if (allMachinesForOrder.length === 0 || allMachinesForOrder.includes('ALL')) {
                for (const machineId in equipmentData) {
                  const machineData = equipmentData[machineId] || [];
                  totalUnitsAllMachines += machineData.filter(d => 
                    d.datetime.getTime() >= order.startTime && 
                    d.datetime.getTime() < order.endTime
                  ).length;
                }
              } else {
                for (const machineId of allMachinesForOrder) {
                  const machineData = equipmentData[machineId] || [];
                  totalUnitsAllMachines += machineData.filter(d => 
                    d.datetime.getTime() >= order.startTime && 
                    d.datetime.getTime() < order.endTime
                  ).length;
                }
              }
              
              const avgTCO = orderPointsThisMachine.length > 0
                ? Math.round(orderPointsThisMachine.reduce((sum, d) => sum + (d.realValue || d.y), 0) / orderPointsThisMachine.length)
                : 0;
              
              const startDate = new Date(order.startTime);
              const startDateStr = startDate.toLocaleDateString('es-AR', {day: '2-digit', month: '2-digit'});
              const startTimeStr = startDate.toLocaleTimeString('es-AR', {hour: '2-digit', minute: '2-digit', hour12: false});
              
              return [
                `Orden ${order.orderNum}`,
                `Modelo: ${order.model}`,
                `Inicio: ${startDateStr} ${startTimeStr}`,
                `Unidades: ${unitsThisMachine} (${totalUnitsAllMachines}) / ${order.quantity}`,
                `TCO: ${order.tco}s (orden) / ${avgTCO}s (real)`,
                `[Click para zoom]`
              ];
            },
            backgroundColor: 'rgba(0, 0, 0, 0.9)',
            color: '#fff',
            font: { size: 10, family: 'monospace' },
            padding: 10,
            borderRadius: 6,
            textAlign: 'left',
            orderData: {
              eq: eq,
              startTime: order.startTime,
              endTime: order.endTime
            }
          };
          
          // Línea vertical roja (más tenue) al final de la orden
          annotations[`orderEnd${idx}`] = {
            type: 'line',
            xMin: order.endTime,
            xMax: order.endTime,
            borderColor: 'rgba(239, 68, 68, 0.45)',
            borderWidth: 2,
            borderDash: [6, 4]
          };
        });
      } else {
        // Sin órdenes: línea TCO estática del config (solo en modo OF)
        if (!isSimpleMode) {
          annotations.tcoLine = {
            type: 'line',
            yMin: tco,
            yMax: tco,
            borderColor: '#fbbf24',
            borderWidth: 1,
            borderDash: [5, 5],
            label: {
              content: `TCO: ${tco}s`,
              enabled: true,
              position: 'end',
              backgroundColor: 'rgba(251, 191, 36, 0.8)',
              color: '#000',
              font: { size: 10 }
            }
          };
        }
        // En modo simple: la línea TCO la genera periodTCO${pi} por período
      }
      
      // ── Anotaciones de líneas verticales de período ──────────────────
      // En modo simple: líneas completas rojas punteadas + tooltip de eficiencia
      // En modo normal: líneas cortas (20%) azules

      if (isSimpleMode) {
        // Líneas verticales rojas punteadas completas en cada corte de período
        verticalLines.forEach((line, idx) => {
          annotations[`vline${idx}`] = {
            type: 'line',
            xMin: line.x,
            xMax: line.x,
            borderColor: 'rgba(239, 68, 68, 0.6)',
            borderWidth: 2,
            borderDash: [6, 4]
          };
        });

        // Tooltip de eficiencia y línea TCO por período (usa simplePeriods pre-calculados)
        simplePeriods.forEach((sp, pi) => {
          // Puntos azules reales (no proyectados, no huecos)
          const bluePoints   = complete.filter(p =>
            !p.isProjected && !p.isHollow && p.x >= sp.start && p.x <= sp.end
          );
          // Puntos amarillos (piezas perdidas dentro del período)
          const yellowPoints = complete.filter(p =>
            p.isProjected && !p.isHollow && p.x >= sp.start && p.x <= sp.end
          );

          const totalPosible = bluePoints.length + yellowPoints.length;
          if (totalPosible < 3) return;

          const optTCO = sp.optTCO;
          const midX   = (sp.start + sp.end) / 2;

          // Factor 1: ocupación — qué fracción del tiempo se produjo realmente
          const ocupacion = bluePoints.length / totalPosible;

          // Factor 2: velocidad — qué tan cerca están los azules del TCO óptimo
          // Para puntos huecos (lentos), usar realValue que es el tiempo real
          // p.y está seteado al TCO (posición visual), no al valor real
          const velSum = bluePoints.reduce((s, p) => {
            const actualValue = p.realValue ?? p.y; // usar valor real siempre
            return s + Math.min(1, optTCO / Math.max(actualValue, 1));
          }, 0);
          const velocidad = bluePoints.length > 0 ? velSum / bluePoints.length : 0;

          // Eficiencia = ocupación × velocidad × 100
          const efficiency = Math.round(ocupacion * velocidad * 100);

          const color = efficiency >= 85 ? '#16a34a'
                      : efficiency >= 65 ? '#f59e0b'
                      : '#dc2626';

          annotations[`periodLabel${pi}`] = {
            type: 'label',
            xValue: midX,
            yValue: ctx => {
              const ys = ctx.chart.scales.y;
              return ys.max - (ys.max - ys.min) * 0.08;
            },
            content: [
              `Ef: ${efficiency}%`,
              `${bluePoints.length} / ${totalPosible} piezas`,
              `TCO: ${optTCO}s`
            ],
            backgroundColor: 'rgba(0,0,0,0.75)',
            color: color,
            font: { size: 10, weight: 'bold', family: 'monospace' },
            padding: { x: 8, y: 4 },
            borderRadius: 5,
            textAlign: 'center',
            borderColor: color,
            borderWidth: 1
          };

          annotations[`periodTCO${pi}`] = {
            type: 'line',
            xMin: sp.start,
            xMax: sp.end,
            yMin: optTCO,
            yMax: optTCO,
            borderColor: '#fbbf24',
            borderWidth: 1,
            borderDash: [5, 5],
            label: {
              content: `TCO ópt: ${optTCO}s`,
              enabled: true,
              position: 'end',
              backgroundColor: 'rgba(251, 191, 36, 0.8)',
              color: '#000',
              font: { size: 10 }
            }
          };
        });

      } else {
        // Modo normal: líneas cortas azules (comportamiento original)
        verticalLines.forEach((line, idx) => {
          annotations[`vline${idx}`] = {
            type: 'line',
            xMin: line.x,
            xMax: line.x,
            yMin: (value) => value.chart.scales.y.min,
            yMax: (value) => {
              const yScale = value.chart.scales.y;
              const range = yScale.max - yScale.min;
              return yScale.min + (range * 0.2);
            },
            borderColor: '#ff6b6b',
            borderWidth: 3,
            borderDash: [5, 5],
            label: {
              content: line.label,
              enabled: true,
              position: 'start',
              backgroundColor: 'rgba(255, 107, 107, 0.8)',
              color: 'white',
              font: { size: 10 }
            }
          };
        });
      }
      
      if (charts[eq]) {
        charts[eq].data.datasets[0].data = complete;
        charts[eq].data.datasets[0].pointBackgroundColor = colors;
        charts[eq].data.datasets[0].pointBorderColor = borderColors;
        charts[eq].data.datasets[0].pointBorderWidth = borderWidths;
        charts[eq].options.scales.x.time.unit = timeUnit;
        charts[eq].options.scales.x.time.stepSize = timeStep;
        charts[eq].options.scales.x.min = minTime.getTime();
        charts[eq].options.scales.x.max = maxTime.getTime();
        charts[eq].options.plugins.annotation.annotations = annotations;
        charts[eq].update('none');
        updateVisibleStats(eq); // Actualizar stats después de update
      } else {
        charts[eq] = new Chart(ctx, {
          type: 'scatter',
          data: {
            datasets: [{
              data: complete,
              pointRadius: settings.pointSize,
              pointBackgroundColor: colors,
              pointBorderColor: borderColors,
              pointBorderWidth: borderWidths,
              showLine: false
            }]
          },
          plugins: [{
            id: 'orderLabelAlign',
            afterDraw(chart) {
              // Ajustar xAdjust de cada orderInfo para que su borde izquierdo
              // coincida con la línea de inicio de la OF
              const annotPlugin = chart.options.plugins.annotation;
              if (!annotPlugin || !annotPlugin.annotations) return;
              let changed = false;
              Object.keys(annotPlugin.annotations).forEach(key => {
                if (!key.startsWith('orderInfo')) return;
                const annot = annotPlugin.annotations[key];
                if (!annot || !annot.orderData) return;
                // Buscar el elemento renderizado para leer su ancho real
                const elements = chart.$annotation?.elements;
                if (!elements) return;
                const el = elements[key];
                if (!el) return;
                const halfWidth = (el.width || 0) / 2;
                const desired = halfWidth; // desplazar centro = mitad del ancho → borde izq en x=0
                if (Math.abs((annot.xAdjust || 0) - desired) > 1) {
                  annot.xAdjust = desired;
                  changed = true;
                }
              });
              if (changed) chart.update('none');
            }
          }],
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            plugins: {
              legend: { display: false },
              annotation: {
                annotations: annotations
              },
              tooltip: {
                enabled: true,
                backgroundColor: 'rgba(0,0,0,0.9)',
                padding: {
                  top: Math.max(15, window.innerHeight * 0.015),
                  bottom: Math.max(15, window.innerHeight * 0.015),
                  left: Math.max(20, window.innerWidth * 0.01),
                  right: Math.max(20, window.innerWidth * 0.01)
                },
                titleFont: { size: Math.max(16, window.innerHeight * 0.02), weight: 'bold' },
                bodyFont: { size: Math.max(18, window.innerHeight * 0.022) },
                displayColors: false,
                cornerRadius: 8,
                caretSize: 8,
                callbacks: {
                  title: i => new Date(i[0].parsed.x).toLocaleString('es-AR'),
                  label: c => {
                    const config = MACHINE_CONFIGS[currentMachineType];
                    const unit = config.useGolCode ? ' piezas' : ' seg';
                    // Leer siempre desde el dataset actual, no del closure
                    const liveData = c.chart.data.datasets[0].data;
                    const point = liveData[c.dataIndex];
                    
                    if (!point) return `Valor: ${c.parsed.y}${unit}`;
                    
                    if (point.code === 'TOK') return `✅ Aprobado: ${c.parsed.y}${unit}`;
                    if (point.code === 'TNG') return `❌ Rechazado: ${c.parsed.y}${unit}`;
                    
                    if (point.isHollow) {
                      return `🔵 Proceso lento: ${point.realValue}${unit} (excede TCO)`;
                    }
                    const p = c.dataset.pointBackgroundColor[c.dataIndex] === '#fbbf24';
                    const label = config.useGolCode 
                      ? (p ? '⚠️ Perdida: ' : 'Piezas: ')
                      : (p ? '⚠️ Perdida: ' : 'Tiempo: ');
                    return label + c.parsed.y + unit;
                  }
                }
              }
            },
            scales: {
              x: {
                type: 'time',
                min: minTime.getTime(),
                max: maxTime.getTime(),
                time: {
                  unit: timeUnit,
                  stepSize: timeStep,
                  displayFormats: { 
                    hour: 'HH:mm', 
                    minute: 'HH:mm', 
                    day: 'dd/MM' 
                  }
                },
                grid: { 
                  color: 'rgba(0,0,0,0.05)',
                  drawOnChartArea: true
                },
                ticks: { 
                  color: '#666', 
                  maxRotation: 0, 
                  autoSkip: false,
                  font: { weight: 'bold' }
                },
                title: {
                  display: true,
                  text: 'Hora',
                  color: '#666',
                  font: { weight: 'bold', size: 14 }
                }
              },
              y: {
                beginAtZero: false,
                grid: { color: 'rgba(0,0,0,0.05)' },
                ticks: { 
                  color: '#666',
                  font: { weight: 'bold' }
                },
                title: {
                  display: true,
                  text: MACHINE_CONFIGS[currentMachineType].useGolCode ? 'Piezas' : 'Tiempo (seg)',
                  color: '#666',
                  font: { weight: 'bold', size: 14 }
                }
              }
            }
          },
          plugins: [{
            id: 'backgroundDates',
            beforeDraw: (chart) => {
              const ctx = chart.ctx;
              const xAxis = chart.scales.x;
              const yAxis = chart.scales.y;
              
              // Dibujar fechas en el fondo
              const minDate = new Date(xAxis.min);
              const maxDate = new Date(xAxis.max);
              const daysDiff = (maxDate - minDate) / (1000 * 60 * 60 * 24);
              
              if (daysDiff > 0.5) { // Solo si abarca más de medio día
                ctx.save();
                ctx.font = 'bold 48px Arial';
                const isDark = document.body.classList.contains('dark');
                ctx.fillStyle = isDark ? 'rgba(200, 200, 200, 0.08)' : 'rgba(150, 150, 150, 0.08)';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                let currentDate = new Date(minDate);
                currentDate.setHours(12, 0, 0, 0);
                
                while (currentDate <= maxDate) {
                  const x = xAxis.getPixelForValue(currentDate.getTime());
                  const y = yAxis.top + (yAxis.height / 2);
                  const dateStr = currentDate.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' });
                  ctx.fillText(dateStr, x, y);
                  currentDate.setDate(currentDate.getDate() + 1);
                }
                
                ctx.restore();
              }
            }
          }]
        });
        
        // Guardar referencia a datos completos para calcular stats visibles
        charts[eq].allData = complete;
        
        // Agregar drag-select
        setupDragSelect(eq);
        
        // Agregar click handler para tooltips de órdenes
        setupOrderTooltipClick(eq);
      }
      
      // Actualizar estadísticas basadas en lo visible en el viewport actual
      updateVisibleStats(eq);
    }
    
    // ========== RENDER GRÁFICO MODO GOL (BALANCINES) ==========
    function renderGolChart(eq, complete, avgVal, settings) {
      // Actualizar estadísticas
      document.getElementById(`stat-total-${eq}`).textContent = complete.length;
      document.getElementById(`stat-avg-${eq}`).textContent = avgVal;
      
      // Determinar límites de tiempo
      const now = new Date();
      let minTime, maxTime;
      
      if (settings.zoomStart && settings.zoomEnd) {
        minTime = new Date(settings.zoomStart);
        maxTime = new Date(settings.zoomEnd);
      } else if (settings.dateFrom || settings.dateTo) {
        minTime = settings.dateFrom || new Date(settings.dateTo.getTime() - (30 * 24 * 60 * 60 * 1000));
        maxTime = settings.dateTo || new Date(settings.dateFrom.getTime() + (30 * 24 * 60 * 60 * 1000));
      } else {
        maxTime = now;
        minTime = new Date(now.getTime() - (settings.filter * 60 * 1000));
      }
      
      // Configurar unidad de tiempo
      let timeUnit = 'hour', timeStep = 1;
      if (settings.filter === 60) { timeUnit = 'minute'; timeStep = 5; }
      else if (settings.filter === 360) { timeUnit = 'minute'; timeStep = 15; }
      else if (settings.filter === 720) { timeUnit = 'minute'; timeStep = 30; }
      else if (settings.filter === 1440) { timeUnit = 'hour'; timeStep = 1; }
      else if (settings.filter === 10080) { timeUnit = 'day'; timeStep = 1; }
      
      const ctx = document.getElementById(`chart-${eq}`).getContext('2d');
      
      if (charts[eq]) {
        charts[eq].data.datasets[0].data = complete;
        charts[eq].options.scales.x.time.unit = timeUnit;
        charts[eq].options.scales.x.time.stepSize = timeStep;
        charts[eq].options.scales.x.min = minTime.getTime();
        charts[eq].options.scales.x.max = maxTime.getTime();
        charts[eq].update('none');
        updateVisibleStats(eq);
      } else {
        charts[eq] = new Chart(ctx, {
          type: 'scatter',
          data: {
            datasets: [{
              data: complete,
              pointRadius: settings.pointSize,
              pointBackgroundColor: '#0066ff',
              pointBorderColor: '#0066ff',
              pointBorderWidth: 0,
              showLine: false
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                enabled: true,
                backgroundColor: 'rgba(0,0,0,0.9)',
                padding: { top: 15, bottom: 15, left: 20, right: 20 },
                titleFont: { size: 16, weight: 'bold' },
                bodyFont: { size: 18 },
                displayColors: false,
                cornerRadius: 8,
                caretSize: 8,
                callbacks: {
                  title: i => new Date(i[0].parsed.x).toLocaleString('es-AR'),
                  label: c => `Golpes (5min): ${c.parsed.y}`
                }
              }
            },
            scales: {
              x: {
                type: 'time',
                min: minTime.getTime(),
                max: maxTime.getTime(),
                time: {
                  unit: timeUnit,
                  stepSize: timeStep,
                  displayFormats: { hour: 'HH:mm', minute: 'HH:mm', day: 'dd/MM' }
                },
                grid: { color: 'rgba(0,0,0,0.05)', drawOnChartArea: true },
                ticks: { color: '#666', maxRotation: 0, autoSkip: false, font: { weight: 'bold' } },
                title: { display: true, text: 'Hora', color: '#666', font: { weight: 'bold', size: 14 } }
              },
              y: {
                beginAtZero: false,
                grid: { color: 'rgba(0,0,0,0.05)' },
                ticks: { color: '#666', font: { weight: 'bold' } },
                title: { display: true, text: 'Golpes (cada 5 min)', color: '#666', font: { weight: 'bold', size: 14 } }
              }
            }
          },
          plugins: [{
            id: 'backgroundDates',
            beforeDraw: (chart) => {
              const ctx = chart.ctx;
              const xAxis = chart.scales.x;
              const yAxis = chart.scales.y;
              
              const minDate = new Date(xAxis.min);
              const maxDate = new Date(xAxis.max);
              const daysDiff = (maxDate - minDate) / (1000 * 60 * 60 * 24);
              
              if (daysDiff > 0.5) {
                ctx.save();
                ctx.font = 'bold 48px Arial';
                const isDark = document.body.classList.contains('dark');
                ctx.fillStyle = isDark ? 'rgba(200, 200, 200, 0.08)' : 'rgba(150, 150, 150, 0.08)';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                let currentDate = new Date(minDate);
                currentDate.setHours(12, 0, 0, 0);
                
                while (currentDate <= maxDate) {
                  const x = xAxis.getPixelForValue(currentDate.getTime());
                  const y = yAxis.top + (yAxis.height / 2);
                  const dateStr = currentDate.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' });
                  ctx.fillText(dateStr, x, y);
                  currentDate.setDate(currentDate.getDate() + 1);
                }
                
                ctx.restore();
              }
            }
          }]
        });
        
        charts[eq].allData = complete;
        setupDragSelect(eq);
      }
      
      updateVisibleStats(eq);
    }

    // ========== ACTUALIZAR ESTADÍSTICAS VISIBLES ==========
    function updateVisibleStats(eq) {
      const chart = charts[eq];
      if (!chart) return;
      
      const xScale = chart.scales.x;
      const data   = chart.data.datasets[0].data;
      
      // Puntos dentro de la ventana X visible (misma lógica que las stats)
      const visibleData = data.filter(d => d.x >= xScale.min && d.x <= xScale.max);
      
      // ── Ajustar escala Y a lo visible ────────────────────────────────
      if (visibleData.length > 0) {
        const ys   = visibleData.map(d => d.y);
        const yMin = Math.min(...ys);
        const yMax = Math.max(...ys);
        const pad  = Math.max((yMax - yMin) * 0.1, yMax * 0.05, 1);
        
        chart.options.scales.y.min = Math.max(0, Math.floor(yMin - pad));
        chart.options.scales.y.max = Math.ceil(yMax + pad);
        chart.options.scales.y.suggestedMax = undefined;
        chart.options.scales.y.beginAtZero  = false;
        chart.update('none');
      }

      // ── Stats en el card ─────────────────────────────────────────────
      const config    = MACHINE_CONFIGS[currentMachineType];
      const isGolMode = config.isGolMode || false;
      
      // Re-filtrar con el Y actualizado
      const yScale     = chart.scales.y;
      const visibleAll = visibleData.filter(d => d.y >= yScale.min && d.y <= yScale.max);
      
      if (isGolMode) {
        const totalGolpes       = visibleAll.reduce((sum, d) => sum + d.y, 0);
        const cantidadRegistros = visibleAll.length;
        document.getElementById(`stat-total-${eq}`).textContent = totalGolpes.toLocaleString('es-AR');
        document.getElementById(`stat-avg-${eq}`).textContent   = cantidadRegistros;
      } else {
        const processes    = visibleAll.filter(d => !d.isProjected);
        const isSimpleMode = (config.ofMode === 0) && !isGolMode;
        
        if (processes.length > 0) {
          const values = processes.map(d => d.realValue || d.y);
          const avg    = Math.round(values.reduce((a, b) => a + b, 0) / values.length);
          document.getElementById(`stat-total-${eq}`).textContent = processes.length;
          document.getElementById(`stat-avg-${eq}`).textContent   = avg;
        } else {
          document.getElementById(`stat-total-${eq}`).textContent = 0;
          document.getElementById(`stat-avg-${eq}`).textContent   = '-';
        }
        
        const optTCOEl = document.getElementById(`stat-opttco-${eq}`);
        if (optTCOEl) {
          if (isSimpleMode && equipmentSettings[eq]?.simpleTCO) {
            optTCOEl.textContent = `TCO óptimo: ${equipmentSettings[eq].simpleTCO}s`;
            optTCOEl.style.display = '';
          } else {
            optTCOEl.style.display = 'none';
          }
        }
      }
    }

    function setupOrderTooltipClick(eq) {
      const canvas = document.getElementById(`chart-${eq}`);
      const chart = charts[eq];
      
      canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        // Verificar si hay órdenes de fabricación
        if (!fabricationOrders[eq] && !fabricationOrders['ALL']) return;
        
        const specificOrders = fabricationOrders[eq] || [];
        const allOrders = fabricationOrders['ALL'] || [];
        const equipmentOrders = [...specificOrders, ...allOrders];
        
        // Buscar si el click fue en algún tooltip de orden
        for (const order of equipmentOrders) {
          const xScale = chart.scales.x;
          const yScale = chart.scales.y;
          
          const orderPixelX = xScale.getPixelForValue(order.startTime);
          if (orderPixelX < xScale.left || orderPixelX > xScale.right) continue;
          
          // Leer xAdjust actual del annotation (actualizado dinámicamente por el plugin)
          const annotKey = `orderInfo${equipmentOrders.indexOf(order)}`;
          const annot = chart.options?.plugins?.annotation?.annotations?.[annotKey];
          const currentXAdjust = annot?.xAdjust || 0;
          
          // El centro del label está en orderPixelX + currentXAdjust
          // El borde izquierdo está en center - mitad del ancho ≈ orderPixelX
          const tooltipCenterX = orderPixelX + currentXAdjust;
          const tooltipHalfWidth = currentXAdjust; // halfWidth = xAdjust cuando borde izq = línea
          const tooltipX = tooltipCenterX - tooltipHalfWidth; // = orderPixelX
          const tooltipWidth = tooltipHalfWidth * 2;
          
          const tooltipY = yScale.getPixelForValue(yScale.max * 0.85);
          const tooltipHeight = 110;
          
          if (x >= tooltipX && x <= tooltipX + tooltipWidth &&
              y >= tooltipY - tooltipHeight/2 && y <= tooltipY + tooltipHeight/2) {
            zoomToOrder(eq, order);
            return;
          }
        }
      });
    }
    
    function setupDragSelect(eq) {
      // Evitar agregar event listeners múltiples veces
      if (dragSelectInitialized[eq]) return;
      dragSelectInitialized[eq] = true;
      
      const wrapper = document.getElementById(`wrapper-${eq}`);
      const canvas = document.getElementById(`chart-${eq}`);
      let isDragging = false, isRightDrag = false, startX, startY, selectionBox, selectionTooltip;
      
      // Click para zoom en tooltips de OF
      wrapper.addEventListener('click', (e) => {
        if (e.button !== 0) return; // Solo click izquierdo
        
        const chart = charts[eq];
        if (!chart || !showOrderTooltips) return;
        
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        // Verificar si el click está en algún tooltip de orden
        const annotations = chart.options.plugins.annotation.annotations;
        
        for (const key in annotations) {
          if (key.startsWith('orderInfo') && annotations[key].orderData) {
            const annotation = annotations[key];
            const order = annotation.orderData;
            
            // Calcular posición del tooltip
            const xScale = chart.scales.x;
            const yScale = chart.scales.y;
            
            const tooltipX = xScale.getPixelForValue(order.startTime) + (annotation.xAdjust || 0);
            const tooltipY = yScale.max * 0.85;
            const tooltipYPixel = yScale.getPixelForValue(tooltipY);
            
            // Dimensiones aproximadas del tooltip (140px ancho, ~100px alto)
            const tooltipWidth = 140;
            const tooltipHeight = 100;
            
            if (x >= tooltipX && x <= tooltipX + tooltipWidth &&
                y >= tooltipYPixel - tooltipHeight && y <= tooltipYPixel) {
              // Click en el tooltip - hacer zoom a la orden
              zoomToOrder(eq, order);
              e.stopPropagation();
              return;
            }
          }
        }
      });
      
      // Click-drag con botón derecho para scroll horizontal
      wrapper.addEventListener('contextmenu', (e) => {
        e.preventDefault(); // Prevenir menú contextual
      });
      
      wrapper.addEventListener('mousedown', (e) => {
        if (e.button === 2) { // Botón derecho
          isRightDrag = true;
          startX = e.clientX;
          wrapper.style.cursor = 'grabbing';
          e.preventDefault();
        } else if (e.button === 0 && e.target === canvas) { // Botón izquierdo
          isDragging = true;
          const rect = canvas.getBoundingClientRect();
          startX = e.clientX - rect.left;
          startY = e.clientY - rect.top;
          
          selectionBox = document.createElement('div');
          selectionBox.className = 'selection-box';
          selectionBox.style.left = startX + 'px';
          selectionBox.style.top = startY + 'px';
          wrapper.appendChild(selectionBox);
          
          selectionTooltip = document.createElement('div');
          selectionTooltip.className = 'selection-tooltip';
          wrapper.appendChild(selectionTooltip);
        }
      });
      
      wrapper.addEventListener('mousemove', (e) => {
        if (isRightDrag) {
          // Drag con botón derecho - scroll horizontal
          const deltaX = e.clientX - startX;
          const chart = charts[eq];
          if (!chart) return;
          
          const xScale = chart.scales.x;
          const range = xScale.max - xScale.min;
          const pixelRange = xScale.width;
          const timePerPixel = range / pixelRange;
          const timeShift = -deltaX * timePerPixel;
          
          const settings = equipmentSettings[eq];
          const newMin = xScale.min + timeShift;
          const newMax = xScale.max + timeShift;
          
          const data = equipmentData[eq] || [];
          if (data.length > 0) {
            const dataMin = Math.min(...data.map(d => d.datetime.getTime()));
            const dataMax = Math.max(...data.map(d => d.datetime.getTime()));
            const now = new Date().getTime();
            
            if (newMin >= dataMin && newMax <= Math.max(dataMax, now)) {
              settings.zoomStart = newMin;
              settings.zoomEnd = newMax;
              updateEquipmentChart(eq);
              startX = e.clientX;
            }
          }
          return;
        }
        
        if (!isDragging) return;
        const rect = canvas.getBoundingClientRect();
        let currentX = e.clientX - rect.left;
        let currentY = e.clientY - rect.top;
        
        // Detectar si el mouse llegó al borde del gráfico (1px antes del límite)
        const edgeThreshold = 20;
        let hitEdge = false;
        
        if (currentX <= edgeThreshold) {
          currentX = 0;
          hitEdge = true;
        } else if (currentX >= rect.width - edgeThreshold) {
          currentX = rect.width;
          hitEdge = true;
        }
        
        if (currentY <= edgeThreshold) {
          currentY = 0;
          hitEdge = true;
        } else if (currentY >= rect.height - edgeThreshold) {
          currentY = rect.height;
          hitEdge = true;
        }
        
        // Si llegó al borde, auto-completar la selección
        if (hitEdge) {
          isDragging = false;
          
          if (selectionBox) selectionBox.remove();
          if (selectionTooltip) selectionTooltip.remove();
          
          const chart = charts[eq];
          const xScale = chart.scales.x;
          const yScale = chart.scales.y;
          
          const x1 = xScale.getValueForPixel(Math.min(startX, currentX));
          const x2 = xScale.getValueForPixel(Math.max(startX, currentX));
          const y1 = yScale.getValueForPixel(Math.max(startY, currentY));
          const y2 = yScale.getValueForPixel(Math.min(startY, currentY));
          
          showSummary(eq, x1, x2, y1, y2);
          return;
        }
        
        const width = Math.abs(currentX - startX);
        const height = Math.abs(currentY - startY);
        const left = Math.min(currentX, startX);
        const top = Math.min(currentY, startY);
        
        selectionBox.style.left = left + 'px';
        selectionBox.style.top = top + 'px';
        selectionBox.style.width = width + 'px';
        selectionBox.style.height = height + 'px';
        
        // Actualizar tooltip con info de selección
        const chart = charts[eq];
        const xScale = chart.scales.x;
        const yScale = chart.scales.y;
        
        const x1 = xScale.getValueForPixel(Math.min(startX, currentX));
        const x2 = xScale.getValueForPixel(Math.max(startX, currentX));
        
        const startDate = new Date(x1);
        const endDate = new Date(x2);
        const duration = (x2 - x1) / 1000; // segundos
        const hours = Math.floor(duration / 3600);
        const minutes = Math.floor((duration % 3600) / 60);
        
        selectionTooltip.innerHTML = `
          <div><span class="selection-tooltip-label">Desde:</span> <span class="selection-tooltip-value">${startDate.toLocaleString('es-AR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'})}</span></div>
          <div><span class="selection-tooltip-label">Hasta:</span> <span class="selection-tooltip-value">${endDate.toLocaleString('es-AR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'})}</span></div>
          <div><span class="selection-tooltip-label">Duración:</span> <span class="selection-tooltip-value">${hours}h ${minutes}m</span></div>
        `;
        
        // Posicionar tooltip
        selectionTooltip.style.left = (currentX + 15) + 'px';
        selectionTooltip.style.top = (currentY + 15) + 'px';
      });
      
      wrapper.addEventListener('mouseup', (e) => {
        if (isRightDrag) {
          isRightDrag = false;
          wrapper.style.cursor = 'default';
          return;
        }
        
        if (!isDragging) return;
        isDragging = false;
        
        const rect = canvas.getBoundingClientRect();
        const endX = e.clientX - rect.left;
        const endY = e.clientY - rect.top;
        
        if (selectionBox) selectionBox.remove();
        if (selectionTooltip) selectionTooltip.remove();
        
        const chart = charts[eq];
        const xScale = chart.scales.x;
        const yScale = chart.scales.y;
        
        const x1 = xScale.getValueForPixel(Math.min(startX, endX));
        const x2 = xScale.getValueForPixel(Math.max(startX, endX));
        const y1 = yScale.getValueForPixel(Math.max(startY, endY));
        const y2 = yScale.getValueForPixel(Math.min(startY, endY));
        
        showSummary(eq, x1, x2, y1, y2);
      });
    }

    function showSummary(eq, x1, x2, y1, y2) {
      const chart = charts[eq];
      const data = chart.data.datasets[0].data;
      
      // Filtrar puntos en el área seleccionada
      const inSelection = data.filter(d => d.x >= x1 && d.x <= x2 && d.y >= y1 && d.y <= y2);
      
      // Procesos completados: azules sólidos y círculos huecos
      const processes = inSelection.filter(d => !d.isProjected);
      
      // Piezas perdidas: solo amarillos sólidos (no huecos)
      const yellowsInSelection = inSelection.filter(d => d.isProjected && !d.isHollow);
      
      let validYellows = 0;
      let redStops = { count: 0, time: 0 }; // Paradas por insumos
      let greenStops = { count: 0, time: 0 }; // Paradas por mantenimiento
      let grayStops = { count: 0, time: 0 }; // Paradas por personal
      let blueStops = { count: 0, time: 0 }; // Paradas por setup
      
      // Agrupar paradas consecutivas del mismo tipo
      const stopGroups = [];
      let currentGroup = null;
      
      for (const yellow of yellowsInSelection) {
        const beforeBlue = data.find(d => !d.isProjected && d.x < yellow.x && d.x >= x1);
        const afterBlue = data.find(d => !d.isProjected && d.x > yellow.x && d.x <= x2);
        
        if (beforeBlue && afterBlue) {
          if (yellow.stopType) {
            // Si es una parada con tipo
            if (!currentGroup || currentGroup.type !== yellow.stopType) {
              // Iniciar nuevo grupo
              if (currentGroup) stopGroups.push(currentGroup);
              currentGroup = {
                type: yellow.stopType,
                startX: yellow.x,
                endX: yellow.x,
                count: 1
              };
            } else {
              // Continuar grupo actual
              currentGroup.endX = yellow.x;
              currentGroup.count++;
            }
          } else {
            // Amarillo normal
            if (currentGroup) {
              stopGroups.push(currentGroup);
              currentGroup = null;
            }
            validYellows++;
          }
        }
      }
      
      // Agregar último grupo si existe
      if (currentGroup) stopGroups.push(currentGroup);
      
      // Calcular estadísticas por tipo de parada
      for (const group of stopGroups) {
        const timeMs = group.endX - group.startX;
        const timeMinutes = Math.round(timeMs / 1000 / 60);
        
        if (group.type === 'red') {
          redStops.count += group.count;
          redStops.time += timeMinutes;
        } else if (group.type === 'green') {
          greenStops.count += group.count;
          greenStops.time += timeMinutes;
        } else if (group.type === 'gray') {
          grayStops.count += group.count;
          grayStops.time += timeMinutes;
        } else if (group.type === 'blue') {
          blueStops.count += group.count;
          blueStops.time += timeMinutes;
        }
      }
      
      if (processes.length === 0) {
        document.getElementById(`summary-${eq}`).innerHTML = '';
        return;
      }
      
      const values = processes.map(d => d.realValue || d.y);
      const avg = (values.reduce((a, b) => a + b, 0) / values.length).toFixed(1);
      const min = Math.min(...values);
      const max = Math.max(...values);
      
      const startDate = new Date(x1).toLocaleString('es-AR');
      const endDate = new Date(x2).toLocaleString('es-AR');
      
      const duration = (x2 - x1) / 1000;
      const hours = Math.floor(duration / 3600);
      const minutes = Math.floor((duration % 3600) / 60);
      
      // Detectar órdenes que se solapan con la selección
      const specificOrders = fabricationOrders[eq] || [];
      const allOrders = fabricationOrders['ALL'] || [];
      const relevantOrders = [...specificOrders, ...allOrders].filter(o =>
        o.startTime < x2 && o.endTime > x1
      );
      
      // Construir bloque HTML de órdenes activas
      let ordersHtml = '';
      if (relevantOrders.length > 0) {
        ordersHtml = relevantOrders.map(o => `
          <div class="summary-stat" style="border-left: 3px solid #ef4444; padding-left: 6px;">
            <div class="summary-stat-label" style="color: #ef4444;">OF ${o.orderNum}</div>
            <div class="summary-stat-value" style="font-size:0.9em;">${o.model}</div>
          </div>
        `).join('');
      }
      
      document.getElementById(`summary-${eq}`).innerHTML = `
        <div class="summary-panel">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <h4 style="margin: 0;">📊 Resumen de Selección</h4>
            <div style="display: flex; gap: 8px;">
              <button id="copy-btn-${eq}" style="padding: 4px 12px; background: #10b981; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85em;" title="Copiar al portapapeles">📋 Copiar</button>
              <button onclick="zoomToSelection('${eq}', ${x1}, ${x2})" style="padding: 4px 12px; background: #0066ff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85em;">🔍 Zoom</button>
              <button onclick="resetZoom('${eq}')" style="padding: 4px 12px; background: #666; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85em;">↺ Reset</button>
            </div>
          </div>
          <div class="summary-stats">
            ${ordersHtml}
            <div class="summary-stat">
              <div class="summary-stat-label">Período</div>
              <div class="summary-stat-value">${startDate}</div>
              <div class="summary-stat-value">${endDate}</div>
            </div>
            <div class="summary-stat">
              <div class="summary-stat-label">Duración</div>
              <div class="summary-stat-value">${hours}h ${minutes}m</div>
            </div>
            <div class="summary-stat">
              <div class="summary-stat-label">Procesos</div>
              <div class="summary-stat-value">${processes.length}</div>
            </div>
            <div class="summary-stat">
              <div class="summary-stat-label">Piezas Perdidas</div>
              <div class="summary-stat-value" style="color: #fbbf24;">${validYellows}</div>
            </div>
            <div class="summary-stat">
              <div class="summary-stat-label">Parada Insumos</div>
              <div class="summary-stat-value" style="color: #dc2626;">${redStops.count} uds / ${redStops.time}m</div>
            </div>
            <div class="summary-stat">
              <div class="summary-stat-label">Parada Mtto</div>
              <div class="summary-stat-value" style="color: #16a34a;">${greenStops.count} uds / ${greenStops.time}m</div>
            </div>
            <div class="summary-stat">
              <div class="summary-stat-label">Parada Personal</div>
              <div class="summary-stat-value" style="color: #6b7280;">${grayStops.count} uds / ${grayStops.time}m</div>
            </div>
            <div class="summary-stat">
              <div class="summary-stat-label">Parada Setup</div>
              <div class="summary-stat-value" style="color: #3b82f6;">${blueStops.count} uds / ${blueStops.time}m</div>
            </div>
            <div class="summary-stat">
              <div class="summary-stat-label">Promedio</div>
              <div class="summary-stat-value">${avg}s</div>
            </div>
            <div class="summary-stat">
              <div class="summary-stat-label">Mínimo</div>
              <div class="summary-stat-value">${min}s</div>
            </div>
            <div class="summary-stat">
              <div class="summary-stat-label">Máximo</div>
              <div class="summary-stat-value">${max}s</div>
            </div>
          </div>
        </div>
      `;
      
      // Agregar event listener al botón de copiar
      setTimeout(() => {
        const copyBtn = document.getElementById(`copy-btn-${eq}`);
        if (copyBtn) {
          copyBtn.onclick = (e) => {
            copySummary(e, eq, startDate, endDate, hours, minutes, processes.length, validYellows, redStops, greenStops, grayStops, blueStops, avg, min, max, relevantOrders);
          };
        }
      }, 0);
    }

    function zoomToOrder(eq, order) {
      // Hacer zoom a la orden
      equipmentSettings[eq].zoomStart = order.startTime;
      equipmentSettings[eq].zoomEnd = order.endTime;
      updateEquipmentChart(eq);
      
      // Mostrar resumen automático de la orden
      const chart = charts[eq];
      if (!chart) return;
      
      const xScale = chart.scales.x;
      const yScale = chart.scales.y;
      
      const x1 = order.startTime;
      const x2 = order.endTime;
      const y1 = yScale.min;
      const y2 = yScale.max;
      
      showSummary(eq, x1, x2, y1, y2);
    }

    function zoomToSelection(eq, x1, x2) {
      equipmentSettings[eq].zoomStart = x1;
      equipmentSettings[eq].zoomEnd = x2;
      updateEquipmentChart(eq);
    }

    function resetZoom(eq) {
      equipmentSettings[eq].zoomStart = null;
      equipmentSettings[eq].zoomEnd = null;
      document.getElementById(`summary-${eq}`).innerHTML = '';
      updateEquipmentChart(eq);
    }
    
    function copySummary(event, eq, startDate, endDate, hours, minutes, processes, lost, redStops, greenStops, grayStops, blueStops, avg, min, max, relevantOrders = []) {
      const config = MACHINE_CONFIGS[currentMachineType];
      
      const ordersText = relevantOrders.length > 0
        ? relevantOrders.map(o => `    OF ${o.orderNum} — ${o.model}`).join('\n')
        : '    (sin órdenes)';
      
      const summaryText = `📊 Resumen de Selección - Equipo ${eq}
══════════════════════════════════════

Órdenes activas:
${ordersText}

Período:
  Desde: ${startDate}
  Hasta: ${endDate}
  Duración: ${hours}h ${minutes}m

Estadísticas:
  Procesos: ${processes}
  Piezas Perdidas: ${lost}
  Parada Insumos: ${redStops.count} uds / ${redStops.time}m
  Parada Mantenimiento: ${greenStops.count} uds / ${greenStops.time}m
  Parada Personal: ${grayStops.count} uds / ${grayStops.time}m
  Parada Setup: ${blueStops.count} uds / ${blueStops.time}m
  Promedio: ${avg}s
  Mínimo: ${min}s
  Máximo: ${max}s

Máquina: ${config.name}
Generado: ${new Date().toLocaleString('es-AR')}`;

      navigator.clipboard.writeText(summaryText).then(() => {
        // Feedback visual
        const btn = event.target;
        const originalText = btn.innerHTML;
        btn.innerHTML = '✓ Copiado';
        btn.style.background = '#059669';
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.style.background = '#10b981';
        }, 2000);
      }).catch(err => {
        console.error('Error al copiar:', err);
        alert('No se pudo copiar al portapapeles');
      });
    }

    // Generar opciones del selector desde MACHINE_CONFIGS
    (function buildSelector() {
      const sel = document.getElementById('machineSelector');
      Object.entries(MACHINE_CONFIGS).forEach(([key, cfg]) => {
        if (!cfg || !cfg.csvUrl || !cfg.name) return; // ignorar inválidas
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = cfg.name;
        sel.appendChild(opt);
      });
    })();

    setInterval(() => loadData(), CONFIG.updateInterval);
    loadData();
  </script>
</body>
</html>
